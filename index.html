<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEEP NEST</title>
    <style>
      :root {
        --ink: #f4e8d2;
        --dim: #a8957c;
        --lamp: #ffc46a;
        --danger: #ff5a4d;
        --gold: #ffd27a;
        --panel: rgba(22, 11, 6, 0.7);
        --edge: rgba(255, 200, 120, 0.2);
        --serif: "Cinzel", "Noto Serif KR", "Nanum Myeongjo", "Batang", "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: #0d0604; overflow: hidden; color: var(--ink);
        font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none;
      }
      /* 가장자리를 어둡게 눌러 동굴 속 느낌을 준다 */
      body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(14, 5, 2, 0.6) 100%); }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; outline: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      /* 화면 중앙 조준점 / 락온 표식 */
      #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      #cross i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border: 1.5px solid rgba(255,214,140,.85); border-radius: 50%; box-shadow: 0 0 6px rgba(255,170,70,.55), inset 0 0 4px rgba(0,0,0,.4); }
      #cross i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: #ffd27a; }
      #lockon { position: absolute; width: 0; height: 0; }
      #lockon i { position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border: 2px solid #ffcf6e; transform: rotate(45deg); box-shadow: 0 0 10px rgba(255,170,70,.7), inset 0 0 8px rgba(255,120,40,.25); animation: lockpulse 1s infinite alternate; }
      @keyframes lockpulse { from { opacity: .65; transform: rotate(45deg) scale(.92); } to { opacity: 1; transform: rotate(45deg) scale(1.06); } }
      /* 불꽃 차징 링: 누르고 있는 동안 채워지고, 가득 차면 밝게 번쩍인다 */
      #cross b { position: absolute; left: -19px; top: -19px; width: 38px; height: 38px; border-radius: 50%; opacity: 0;
        background: conic-gradient(from 0deg, rgba(255,214,140,.95) calc(var(--p, 0) * 1turn), rgba(255,255,255,0) 0);
        -webkit-mask: radial-gradient(circle, transparent 15px, #000 16px, #000 19px, transparent 19.5px);
        mask: radial-gradient(circle, transparent 15px, #000 16px, #000 19px, transparent 19.5px); }
      #cross.drawing b { opacity: 1; }
      #cross.drawing i { transform: scale(.78); transition: transform .08s; }
      #cross.full b { background: conic-gradient(#fff3c8 0 1turn); filter: drop-shadow(0 0 7px #ffb347); animation: fullpulse .35s ease-in-out infinite alternate; }
      #cross.full i { border-color: #fff3c8; box-shadow: 0 0 10px rgba(255,200,110,.9); }
      @keyframes fullpulse { from { opacity: .7; } to { opacity: 1; } }
      #cross.hidden, #lockon.hidden { display: none; }
      .hidden { display: none !important; }

      /* 보스 체력바 */
      #bossbar { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: min(640px, 70vw); text-align: center; }
      #bossname { font-family: var(--serif); font-size: 16px; font-weight: 700; letter-spacing: 0.22em; color: #ffe3b0; text-shadow: 0 1px 8px #000, 0 0 14px rgba(255,140,50,.35); margin-bottom: 6px; }
      #bosstrack { position: relative; height: 12px; background: rgba(10,3,1,.7); border: 1px solid rgba(255,205,130,.55); border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 2px rgba(10,3,1,.55), 0 0 14px rgba(255,120,40,.25); }
      #bossfill, #bosschip { position: absolute; left: 0; top: 0; height: 100%; width: 100%; }
      #bossfill { background: linear-gradient(90deg, #8f1b1b, #e24a2e); transition: width .12s linear; }
      #bosschip { background: rgba(255,226,180,.6); transition: width .5s ease .2s; }
      #bossmarks i { position: absolute; top: 0; width: 2px; height: 100%; background: rgba(255,226,180,.85); transform: translateX(-1px); z-index: 2; }
      #bosssub { display: flex; gap: 10px; }
      #bosssub.hidden { display: none; }
      #bosssub .sb { position: relative; flex: 1; height: 12px; background: rgba(10,3,1,.7); border: 1px solid rgba(255,205,130,.55); border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 2px rgba(10,3,1,.55), 0 0 14px rgba(255,120,40,.25); }
      #bosssub .sb i { position: absolute; left: 0; top: 0; height: 100%; width: 100%; }
      #bosssub .sf { background: linear-gradient(90deg, #8f1b1b, #e24a2e); transition: width .12s linear; }
      #bosssub .sc { background: rgba(255,226,180,.6); transition: width .5s ease .2s; }
      #bosssub .sb.dead { opacity: .35; }
      #bossfill.exposed { background: linear-gradient(90deg, #d9962b, #ffd27a); }
      #bosstag { height: 18px; margin-top: 5px; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--gold); opacity: 0; transition: opacity .1s; }
      #bosstag.on { opacity: 1; animation: blink .5s infinite alternate; }
      @keyframes blink { from { opacity: .55; } to { opacity: 1; } }

      /* 좌하단: 등불(체력) / 대시 / 특수 */
      #bl { position: absolute; right: 22px; bottom: 22px; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 14px 10px; width: max-content; backdrop-filter: blur(3px); box-shadow: inset 0 0 0 3px rgba(10,3,1,.35); }
      #lamps { display: flex; gap: 8px; margin-bottom: 8px; width: 182px; justify-content: center; } /* 5칸 기준 고정 폭 — 칸이 줄어도 박스 크기는 그대로, 남은 칸은 가운데 정렬 */
      /* 체력(불꽃): 켜진 칸은 일렁이며 타오르고, 꺼진 칸은 점선 윤곽만 남은 빈 불꽃 */
      .lamp { position: relative; width: 30px; height: 38px; }
      .lamp svg { display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; filter: drop-shadow(0 0 6px rgba(255,140,40,.8)); }
      .lamp .fo { fill: url(#gFlameO); stroke: rgba(255,232,180,.9); stroke-width: 1; stroke-linejoin: round; }
      .lamp .fi { fill: url(#gFlameI); }
      .lamp.off svg { filter: none; animation: none; }
      .lamp.off .fo { fill: rgba(28,20,15,.88); stroke: #b3a28a; stroke-width: 1.5; stroke-dasharray: 2.6 2.2; }
      .lamp.off .fi { display: none; }
      /* 방금 꺼진 칸: 크게 부풀며 붉게 번쩍이고 사그라든다 */
      .lamp.hit svg { animation: flamehit .6s ease-out; }
      .lamp.hit .fo { animation: fohit .6s ease-out; }
      @keyframes flamehit { 0% { transform: scale(1.55, 1.35); filter: drop-shadow(0 0 9px rgba(255,50,30,1)) drop-shadow(0 0 18px rgba(255,50,30,.8)); } 100% { transform: scale(1); filter: none; } }
      @keyframes fohit { 0% { fill: #ff3b26; stroke: #fff1ea; } }

      /* 화면 가장자리 붉은 연출: 맞은 순간 번쩍(#hurt) + 체력이 1~2칸일 때 계속 맥동(#lowhp) */
      #hurt, #lowhp { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
      #hurt { background: radial-gradient(ellipse at center, rgba(255,40,20,.22) 10%, rgba(215,20,10,.62) 52%, rgba(130,0,0,.97) 100%); }
      #hurt::after { content: ""; position: absolute; inset: 0; background: rgba(255,35,20,.3); }
      #hurt.on { animation: hurt 1.7s ease-out; }
      @keyframes hurt { 0% { opacity: 1; } 35% { opacity: .72; } 100% { opacity: 0; } }
      #lowhp { background: radial-gradient(ellipse at center, transparent 50%, rgba(190,20,10,.5) 100%); }
      #lowhp.on { animation: lowpulse 1.5s ease-in-out infinite alternate; }
      #lowhp.crit { background: radial-gradient(ellipse at center, transparent 38%, rgba(215,15,8,.7) 100%); animation-duration: .7s; }
      @keyframes lowpulse { from { opacity: .3; } to { opacity: 1; } }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--dim); }
      .row .lbl { width: 78px; }
      kbd { font: inherit; font-size: 10px; padding: 1px 5px; border: 1px solid rgba(255,215,150,.4); border-radius: 3px; color: var(--ink); }
      .mini { flex: 1; height: 8px; background: rgba(10,3,1,.65); border-radius: 2px; overflow: hidden; border: 1px solid rgba(255,205,130,.25); }
      #dashfill, #spfill { height: 100%; width: 0; background: #b87a30; }
      #dashfill.ready { background: #ffc46a; }
      #spfill { background: #b8651f; }
      #spwrap.ready #spfill { background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: blink .35s infinite alternate; }
      #spwrap.ready .lbl { color: var(--gold); font-weight: 700; }

      /* 좌상단: 도움말 / 우상단: 상태 */
      #topright { position: absolute; top: 18px; right: 22px; text-align: right; font-size: 12px; color: var(--dim); text-shadow: 0 1px 6px #000; }
      #status b { color: var(--gold); }
      #fps { opacity: .6; margin-top: 2px; }

      #toast { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 4px; background: var(--panel); border: 1px solid var(--edge); font-size: 13px; opacity: 0; transition: opacity .2s; }
      #toast.on { opacity: 1; }

      /* 데미지 숫자 */
      #dmglayer { position: absolute; inset: 0; overflow: hidden; }
      .dmg { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 18px; color: #fff4dc; text-shadow: 0 0 6px rgba(0,0,0,.9), 0 1px 2px #000; animation: floatUp .8s ease-out forwards; white-space: nowrap; }
      .dmg.weak { font-size: 24px; }
      .dmg.exposed { font-size: 30px; }
      .dmg.special { font-size: 38px; }
      /* 색은 숫자(피해량)에 따라: 1~9 흰색 / 10대 노란색 / 20~30대 주황색 / 40 이상 빨간색 */
      .dmg.t1 { color: #ffffff; }
      .dmg.t2 { color: #ffe23d; }
      .dmg.t3 { color: #ff7426; text-shadow: 0 0 9px rgba(255,90,20,.65), 0 1px 2px #000; }
      .dmg.t3.normal { font-size: 22px; }
      .dmg.t4 { color: #ff3b2e; text-shadow: 0 0 13px rgba(255,40,20,.85), 0 0 3px rgba(80,0,0,.9), 0 1px 2px #000; }
      .dmg.t4.normal { font-size: 27px; }
      .dmg.player { color: var(--danger); font-size: 28px; }
      @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }

      /* 중앙 배너 (보스 등장 / 페이즈 전환) */
      #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; opacity: 0; pointer-events: none; }
      #banner.on { animation: bannerIn var(--dur, 2.4s) ease-out forwards; }
      #banner .bt { font-family: var(--serif); font-size: clamp(30px, 5.4vw, 64px); font-weight: 800; letter-spacing: .28em; text-indent: .28em; color: #fff0d0; text-shadow: 0 0 28px rgba(255,110,40,.8), 0 2px 10px #000; }
      #banner .bs { margin-top: 8px; font-size: clamp(13px, 1.8vw, 18px); letter-spacing: .3em; color: var(--lamp); text-shadow: 0 1px 8px #000; }
      @keyframes bannerIn { 0% { opacity: 0; transform: scale(1.18); } 10% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; } }

      /* 디버프 표시 */
      .dbg { color: #ffb347; }


      /* 일시정지 화면의 키 설정 패널 */
      #overlay.compact { background: radial-gradient(ellipse at center, rgba(12,5,2,.82), rgba(12,5,2,.95)); }
      #overlay.compact #ovtitle { font-size: clamp(24px, 4.4vw, 40px); }
      #overlay.compact #ovbody { margin-top: 10px; }
      .settings { margin: 0 auto; display: flex; gap: 14px; align-items: flex-start; justify-content: center; width: min(1240px, 94vw); text-align: left; cursor: default; }
      .st-tabs { flex: none; display: flex; flex-direction: column; gap: 8px; width: 120px; }
      .st-tab { font: inherit; font-size: 14px; letter-spacing: .12em; cursor: pointer; padding: 10px 12px; text-align: left; border: 1px solid rgba(255,205,130,.28); border-radius: 6px; background: rgba(20,8,3,.6); color: #b8a68a; transition: border-color .1s, color .1s, background .1s; }
      .st-tab:hover { border-color: rgba(255,205,130,.7); color: #ffe9b8; }
      .st-tab.sel { border-color: #ffd27a; background: rgba(120,50,10,.55); color: #ffe9b8; box-shadow: 0 0 12px rgba(255,150,50,.3); }
      .st-body { flex: 1; min-width: 0; display: grid; }
      .st-body > .keypanel { grid-area: 1 / 1; }
      .st-body > .keypanel:not(.active) { visibility: hidden; pointer-events: none; }
      .settings .keypanel { width: 100%; }
      .st-grid input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer; background: linear-gradient(90deg, #e08a2e var(--p, 100%), rgba(255,226,180,.18) var(--p, 100%)); }
      .st-grid input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ffd27a; border: 2px solid #7a3a10; box-shadow: 0 0 8px rgba(255,170,60,.6); }
      .st-grid input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #ffd27a; border: 2px solid #7a3a10; }
      .keypanel { margin: 0 auto; width: min(560px, 92vw); max-height: calc(100vh - 200px); display: flex; flex-direction: column; text-align: left; cursor: default; background: rgba(22,11,6,.82); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 18px 10px; box-shadow: inset 0 0 0 3px rgba(10,3,1,.35); }
      .kp-top { flex: none; padding-bottom: 6px; border-bottom: 1px solid rgba(255,200,120,.14); }
      .kp-body { flex: 1; min-height: 0; overflow-y: auto; padding-top: 6px; }
      .kp-head { display: flex; align-items: center; gap: 14px; }
      .kp-head .kp-btn, .kp-head .kp-msg { white-space: nowrap; }
      .kp-head .kp-btn { margin-left: auto; }
      .kp-head .kp-msg { margin: 0; min-height: 0; font-size: 12px; }
      .kp-val { grid-column: 2 / 4; text-align: center; font-size: 13px; color: var(--dim); padding: 2px 0; white-space: nowrap; }
      .kp-val b { color: var(--ink); font-weight: 600; }
      .kp-fixed { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,200,120,.12); }
      .kp-debug { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,200,120,.12); }
      .kp-debug summary { cursor: pointer; font-size: 12px; color: var(--dim); padding: 2px 0 4px; }
      .st-grid .kp-label { padding: 8px 0; }
      .st-val { color: var(--gold); font-size: 13px; text-align: right; }
      .kp-head > span:first-child { font-family: var(--serif); font-size: 15px; font-weight: 700; letter-spacing: .16em; color: #ffe3b0; }
      .kp-grid { display: grid; grid-template-columns: 1fr 120px 120px; align-items: center; }
      .st-sound .st-grid { grid-template-columns: 100px minmax(0, 1fr) 50px; column-gap: 10px; }
      .kp-th { font-size: 11px; letter-spacing: .12em; color: var(--dim); text-align: center; padding-bottom: 2px; }
      .kp-label { font-size: 14px; color: var(--ink); padding: 2px 0; }
      .kp-label small { margin-left: 8px; font-size: 11px; color: var(--dim); }
      .kp-cell { padding: 2px 0; text-align: center; }
      .kp-sep { border-top: 1px solid rgba(255,200,120,.12); margin-top: 3px; padding-top: 5px; }
      .keycap { display: inline-block; min-width: 100px; padding: 3px 10px; font-size: 13px; line-height: 1.4; text-align: center; color: var(--ink); background: rgba(10,3,1,.65); border: 1px solid rgba(255,205,130,.4); border-radius: 4px; cursor: pointer; transition: border-color .12s, background .12s; }
      .keycap:hover { border-color: var(--lamp); background: rgba(60,28,10,.7); }
      .keycap.empty { color: rgba(168,149,124,.55); border-style: dashed; }
      .keycap.listening { color: var(--gold); border-color: var(--gold); background: rgba(90,45,10,.75); animation: blink .5s infinite alternate; }
      .kp-msg { min-height: 20px; margin-top: 4px; font-size: 12.5px; color: var(--dim); }
      .kp-msg.ok { color: var(--gold); }
      .kp-msg.err { color: var(--danger); }
      .kp-msg.hint { color: var(--lamp); }
      .kp-btn { font-size: 12px; padding: 3px 12px; color: var(--lamp); border: 1px solid rgba(255,205,130,.4); border-radius: 999px; cursor: pointer; }
      .kp-btn:hover { background: rgba(60,28,10,.7); border-color: var(--lamp); }
      .kp-debug b { color: var(--ink); font-weight: 600; }

      /* 오버레이(타이틀 / 사망) */
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(14,6,3,.55), rgba(14,6,3,.92)); text-align: center; cursor: pointer; }
      #ovtitle { font-family: var(--serif); font-size: clamp(28px, 6vw, 56px); letter-spacing: .22em; text-indent: .22em; font-weight: 800; color: #ffd98a; background: linear-gradient(180deg, #fff1c4 10%, #f0a640 55%, #b8561a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 18px rgba(255,120,30,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.8)); }
      #ovbody { margin-top: 18px; font-size: 15px; line-height: 1.9; color: var(--ink); }
      #ovbody .bcards { margin: 16px 0 6px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      #ovbody .bcard { font: inherit; cursor: pointer; width: clamp(150px, 26vw, 230px); min-height: 150px; padding: 18px 14px; border: 1px solid rgba(255,205,130,.35); border-radius: 10px; background: linear-gradient(180deg, rgba(34,14,6,.85), rgba(14,6,3,.85)); color: #cdb996; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: transform .12s, border-color .12s, box-shadow .12s; }
      #ovbody .bcard .fl { font-size: 12px; letter-spacing: .12em; opacity: .75; }
      #ovbody .bcard .nm { font-size: clamp(17px, 2.2vw, 22px); letter-spacing: .12em; color: #ffe9b8; }
      #ovbody .bcard .st { font-size: 12px; opacity: .8; }
      #ovbody .bcard:hover { border-color: rgba(255,205,130,.8); transform: translateY(-2px); }
      #ovbody .bcard.sel { border-color: #ffd27a; background: linear-gradient(180deg, rgba(130,52,10,.7), rgba(40,14,4,.9)); box-shadow: 0 0 22px rgba(255,150,50,.45); transform: translateY(-3px) scale(1.03); }
      #ovbody .bcard.locked { cursor: not-allowed; filter: grayscale(.85) brightness(.6); }
      #ovbody .bcard.locked:hover { transform: none; border-color: rgba(255,205,130,.35); }
      #ovbody .bcard.locked .nm { color: #8a7a68; }
      #ovbody .bcard.shake { animation: bshake .3s; }
      @keyframes bshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
      #ovbody .ovbtns { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 8px; }
      #ovbody .ovbtns .startbtn { width: 240px; padding-left: 0; padding-right: 0; }
      #ovbody .minibtns { position: fixed; left: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
      #ovbody .minibtn { font: inherit; font-size: 13px; cursor: pointer; padding: 6px 14px; border: 1px solid rgba(255,205,130,.3); border-radius: 6px; background: rgba(20,8,3,.6); color: #b8a68a; transition: border-color .1s, color .1s; }
      #ovbody .minibtn:hover { border-color: rgba(255,205,130,.8); color: #ffe9b8; }
      #ovbody .minibtn.armed { border-color: #ff6a5a; color: #ffd9d2; background: rgba(110,12,12,.6); }
      #ovbody .diffs { margin: 14px 0 4px; display: flex; gap: 10px; justify-content: center; }
      #ovbody .diff { font: inherit; cursor: pointer; min-width: 112px; padding: 8px 14px; border: 1px solid rgba(255,205,130,.35); border-radius: 6px; background: rgba(20,8,3,.6); color: #cdb996; display: flex; flex-direction: column; align-items: center; line-height: 1.35; transition: transform .1s, border-color .1s, background .1s; }
      #ovbody .diff b { font-size: 16px; letter-spacing: .12em; }
      #ovbody .diff small { font-size: 12px; opacity: .8; }
      #ovbody .diff:hover { border-color: rgba(255,205,130,.8); transform: translateY(-1px); }
      #ovbody .diff.sel { border-color: #ffd27a; background: rgba(120,50,10,.55); color: #ffe9b8; box-shadow: 0 0 14px rgba(255,150,50,.35); }
      #ovbody .diff[data-d="crazy"].sel { border-color: #ff6a5a; background: rgba(110,12,12,.6); color: #ffd9d2; box-shadow: 0 0 14px rgba(255,60,40,.45); }
